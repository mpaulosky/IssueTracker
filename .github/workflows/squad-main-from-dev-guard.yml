---
name: Squad Main Source Guard

'on':
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

jobs:
  guard-main-source:
    name: guard-main-source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            if (context.eventName !== "pull_request") {
              core.info("Not a pull_request event.");
              return;
            }
            const source = context.payload.pull_request.head.ref;
            const isReleaseBranch = source.startsWith("rel/");
            const isHotfixBranch = source.startsWith("hotfix/");
            if (!isReleaseBranch && !isHotfixBranch) {
              core.setFailed(
                `PRs to main must come from rel/* or hotfix/*. All other source branches are blocked. Current source: ${source}`
              );
            }
