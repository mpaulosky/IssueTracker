---
name: lint-yaml

"on":
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  lint-yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Run yamllint
        run: |
          python -m pip install --quiet yamllint
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            mapfile -t files < <(
              git diff --diff-filter=ACMRT --name-only \
                "${{ github.event.pull_request.base.sha }}" \
                "${{ github.event.pull_request.head.sha }}" -- '*.yml' '*.yaml' \
              | grep -Ev '^(\.squad/|team-docs/)' || true
            )
          else
            mapfile -t files < <(git ls-files '*.yml' '*.yaml' | grep -Ev '^(\.squad/|team-docs/)' || true)
          fi
          if [ ${#files[@]} -eq 0 ]; then
            echo "No YAML files to lint."
            exit 0
          fi
          config="{extends: default, rules: {document-start: disable, line-length: {max: 200, allow-non-breakable-inline-mappings: true}, truthy: {allowed-values: ['true', 'false', 'on']}}}"
          yamllint -s -d "$config" "${files[@]}"
