# yamllint disable rule:line-length
---
name: Squad Prepare Release PR

'on':
  workflow_dispatch:
    inputs:
      release_suffix:
        description: "Release branch suffix (default: YYYY-MM-DD)"
        required: false
        type: string
      dry_run:
        description: "Dry run — generate branch name without pushing or opening a PR"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-release-pr:
    name: Prepare rel/* branch from dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch all branches
        run: git fetch --all --prune

      - name: Determine release branch
        id: branch
        shell: bash
        run: |
          set -euo pipefail
          suffix="${{ inputs.release_suffix }}"
          if [ -z "$suffix" ]; then
            suffix="$(date -u +%Y-%m-%d)"
          fi

          branch="rel/${suffix}"
          echo "name=$branch" >> "$GITHUB_OUTPUT"
          echo "Using release branch: $branch"

      - name: Build release candidate branch
        shell: bash
        run: |
          set -euo pipefail

          branch="${{ steps.branch.outputs.name }}"
          git checkout -B "$branch" origin/dev

          # Strip team state from release payload (keeps files on dev branch).
          git rm -r --cached --ignore-unmatch .squad team-docs || true

          if ! git diff --cached --quiet; then
            git commit -m "chore(release): strip squad/team state from release payload"
          else
            echo "No forbidden paths were tracked; no strip commit needed."
          fi

      - name: Push release candidate branch
        if: ${{ inputs.dry_run == 'false' }}
        run: |
          git push -u origin "${{ steps.branch.outputs.name }}"

      - name: Open release PR (rel/* -> main)
        if: ${{ inputs.dry_run == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          branch="${{ steps.branch.outputs.name }}"
          title="release: dev -> main (${branch#rel/})"
          body="Automated release candidate from origin/dev.\n\n- Source: \`${branch}\`\n- Target: \`main\`\n- Forbidden paths stripped: \`.squad/\`, \`team-docs/\`"

          if gh pr view "$branch" --json number >/dev/null 2>&1; then
            echo "PR already exists for $branch."
          else
            gh pr create \
              --base main \
              --head "$branch" \
              --title "$title" \
              --body "$body"
          fi

      - name: Dry run complete
        if: ${{ inputs.dry_run == 'true' }}
        run: |
          echo "Dry run complete."
          echo "Would prepare branch: ${{ steps.branch.outputs.name }}"
